    #cbf-export-char { margin-bottom: 10px; }
    .cbf-save-status { padding-top: 8px; margin-top: 8px; }
    .cbf-body { padding: 18px 16px 50px 16px; }

let currentUser = null;
let db = { activeCharacter: "逢白淥", names: ["逢白淥", "迆落"] };
let activeTab = "profile";
let showExport = false;
let currentData = null;
let saveTimer = null;

function userDocRef(...segments) {
  return doc(dbFs, "users", currentUser.uid, ...segments);
}

async function loadIndex() {
  try {
    const snap = await getDoc(userDocRef("meta", "index"));
    if (snap.exists()) return snap.data();
  } catch (e) { console.warn("讀取索引失敗", e); }
  return { activeCharacter: "逢白淥", names: ["逢白淥", "迆落"] };
}
async function saveIndex() {
  try { await setDoc(userDocRef("meta", "index"), db); } catch (e) { console.warn("儲存索引失敗", e); }
}
async function loadCharacterDoc(name) {
  try {
    const snap = await getDoc(userDocRef("characters", name));
    if (snap.exists()) return snap.data();
  } catch (e) { console.warn("讀取角色失敗", e); }
  return null;
}
async function saveCharacterDoc(name, data) {
  await setDoc(userDocRef("characters", name), data);
}
async function deleteCharacterDoc(name) {
  await deleteDoc(userDocRef("characters", name));
}

async function loadAll() {
  db = await loadIndex();
  for (const name of db.names) {
    const existing = await loadCharacterDoc(name);
    if (!existing) {
      const seed = name === "逢白淥" ? fengBaiLu() : blankCharacter(name);
      await saveCharacterDoc(name, seed);
    }
  }
  await saveIndex();
}

async function getCurrentChar() {
  const data = await loadCharacterDoc(db.activeCharacter);
  if (data) return data;
  return blankCharacter(db.activeCharacter);
}

function markSaving() {
  const el = document.getElementById("cbf-save-text");
  const dot = document.getElementById("cbf-save-dot");
  if (el) { el.textContent = "同步中…"; dot.style.background = "var(--warn)"; }
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await saveCharacterDoc(db.activeCharacter, currentData);
      if (el) { el.textContent = "已同步"; dot.style.background = "var(--ok)"; }
    } catch (e) {
      if (el) { el.textContent = "同步失敗，請檢查網路"; dot.style.background = "#b06060"; }
    }
  }, 500);
}

function counter(current, max) {
  const over = current > max;
  return `<div class="cbf-counter ${over ? 'over' : ''}">${current}/${max}</div>`;
}
function field(label, opts, inner) {
  const req = opts.req ? '<span class="req">*</span>' : (opts.optional !== false ? '<span class="optional">(選擇性)</span>' : '');
  const hint = opts.hint ? `<div class="cbf-field-hint">${opts.hint}</div>` : '';
  return `<div class="cbf-field"><div class="cbf-field-label">${label}${req}</div>${hint}${inner}</div>`;
}
function currentTabMeta() { return TABS.find(t => t.id === activeTab); }
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}
function escapeAttr(str) {
  return (str || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

function generateExportMarkdown(d) {
  d = d || {};
  d.profile = d.profile || {};
  d.basic = d.basic || {};
  d.firstScene = d.firstScene || {};
  d.details = d.details || {};
  d.details.extras = d.details.extras || [];
  d.events = d.events || [];
  d.stories = d.stories || {};
  d.stories.items = d.stories.items || [];
  d.settingBook = d.settingBook || {};
  d.other = d.other || {};

  let md = `# ${d.profile.name || "（未命名角色）"}\n\n`;
  md += `## 個人資料\n`;
  md += `- 母語：${d.profile.nativeLang}\n`;
  md += `- 姓名：${d.profile.name}\n`;
  md += `- 年齡：${d.profile.age}\n`;
  md += `- 職業：${d.profile.job}\n`;
  md += `- 來自角色的一句話：${d.profile.quote}\n`;
  md += `- 敘述：\n${d.profile.narration}\n`;
  md += `- 標籤：${d.profile.tags.join("、")}\n`;
  md += `- 創作者筆記：${d.profile.creatorNote}\n\n`;

  md += `## 基本設定\n`;
  md += `- 性別：${d.basic.gender}\n`;
  md += `- 基本資訊：\n${d.basic.info}\n\n`;
  md += `- 性格：\n${d.basic.personality}\n\n`;
  md += `- 說話風格與習慣：\n${d.basic.speech}\n\n`;

  md += `## 首場\n`;
  md += `- 情境腳本：\n${d.firstScene.scenario}\n\n`;
  md += `- 角色對話：\n${d.firstScene.dialogue}\n\n`;

  md += `## 詳細設定\n`;
  md += `- 喜歡：${d.details.likes}\n`;
  md += `- 不喜歡：${d.details.dislikes}\n`;
  md += `- 生日：${d.details.birthday}\n`;
  md += `- 附加資訊（${d.details.extras.length}/10）：\n`;
  d.details.extras.forEach((ex,i) => { md += `  ${i+1}. **${ex.name}**：${ex.content}\n`; });
  md += `\n`;

  md += `## 事件（創作者事件）\n`;
  d.events.forEach((ev,i) => { md += `${i+1}. 【${ev.title}】（${ev.timeLocation}）\n${ev.content}\n\n`; });

  md += `## 故事\n`;
  md += `- 序章【${d.stories.prologueTitle}】：\n${d.stories.prologueContent}\n\n`;
  d.stories.items.forEach((st,i) => {
    md += `- [${st.tier}] 【${st.title}】（解鎖提示：${st.unlockPrompt}／多重結局：${st.multiEnding ? "是" : "否"}）\n${st.content}\n\n`;
  });

  md += `## 設定集（草稿）\n${d.settingBook.note}\n\n`;
  md += `## 其他（暫存筆記）\n${d.other.note}\n`;
  return md;
}

function renderExportView() {
  const body = document.getElementById("cbf-body");
  let md = "";
  let genError = "";
  try {
    md = generateExportMarkdown(currentData);
  } catch (e) {
    genError = "產生匯出內容時發生錯誤，請按下方「返回填寫」重試，或告知我這則錯誤訊息：" + e.message;
  }
  body.innerHTML = `
    <div class="cbf-header-row"><span class="cbf-header-dot" style="background:var(--accent)"></span><span class="cbf-header-title">匯出「${escapeHtml(db.activeCharacter)}」給 Claude 讀取</span></div>
    <div class="cbf-section-note">複製下方全部內容貼到對話裡，或下載成檔案後上傳給我，我就能讀到你目前填寫的內容。</div>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <button class="cbf-btn" id="cbf-export-back">← 返回填寫</button>
      ${genError ? "" : `<button class="cbf-btn" id="cbf-export-copy">複製全部內容</button><button class="cbf-btn" id="cbf-export-download">下載為 .md 檔案</button>`}
    </div>
    ${genError ? `<div class="cbf-pending">${escapeHtml(genError)}</div>` : `<textarea class="cbf-textarea tall" style="min-height:420px;font-size:12.5px" readonly id="cbf-export-text">${escapeHtml(md)}</textarea>`}
  `;
  document.getElementById("cbf-export-back").onclick = () => { showExport = false; renderBody(); };
  if (!genError) {
    document.getElementById("cbf-export-copy").onclick = () => {
      const ta = document.getElementById("cbf-export-text");
      ta.select();
      navigator.clipboard?.writeText(ta.value).catch(()=>{ document.execCommand("copy"); });
      const btn = document.getElementById("cbf-export-copy");
      const original = btn.textContent;
      btn.textContent = "已複製";
      setTimeout(()=>{ btn.textContent = original; }, 1400);
    };
    document.getElementById("cbf-export-download").onclick = () => {
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${db.activeCharacter || "character"}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
  }
}

function renderNav() {
  const nav = document.getElementById("cbf-nav");
  nav.innerHTML = TABS.map(t => `
    <button class="cbf-nav-item ${t.id===activeTab?'active':''}" data-tab="${t.id}">
      <span class="dot" style="background:${t.dot}"></span>
      <span>${t.label}</span>
      ${t.req ? '<span class="req-mark">*</span>' : ''}
    </button>`).join("");
  nav.querySelectorAll(".cbf-nav-item").forEach(btn => {
    btn.onclick = () => { activeTab = btn.dataset.tab; showExport = false; renderNav(); renderBody(); };
  });
}

function renderCharSelect() {
  const sel = document.getElementById("cbf-char-select");
  sel.innerHTML = db.names.map(n => `<option value="${n}" ${n===db.activeCharacter?'selected':''}>${n}</option>`).join("");
  sel.onchange = async () => {
    db.activeCharacter = sel.value;
    await saveIndex();
    currentData = await getCurrentChar();
    activeTab = "profile"; showExport = false;
    renderNav();
    renderBody();
  };
}

function bindText(id, getVal, setVal, max) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("input", () => {
    setVal(el.value);
    const c = document.getElementById(id + "-counter");
    if (c && max) c.outerHTML = counter(el.value.length, max);
    markSaving();
  });
}

function renderBody() {
  if (showExport) { renderExportView(); return; }
  const body = document.getElementById("cbf-body");
  const d = currentData;
  const meta = currentTabMeta();
  let html = `<div class="cbf-header-row"><span class="cbf-header-dot" style="background:${meta.dot}"></span><span class="cbf-header-title">${meta.label}</span></div>`;

  if (activeTab === "profile") {
    html += `<div class="cbf-section-note">角色最基本的公開資訊。</div>`;
    html += field("個人資料圖片", {req:true, optional:false}, `<div class="cbf-field-hint">此工具不處理圖片上傳，請直接在卿卿我我後台上傳圖片。</div>`);
    html += field("母語", {optional:true}, `
      <select class="cbf-input" id="f-nativeLang">
        <option ${d.profile.nativeLang==="繁體中文"?"selected":""}>繁體中文</option>
        <option ${d.profile.nativeLang==="한국어"?"selected":""}>한국어</option>
        <option ${d.profile.nativeLang==="English"?"selected":""}>English</option>
        <option ${d.profile.nativeLang==="日本語"?"selected":""}>日本語</option>
      </select>`);
    html += field("姓名", {req:true, optional:false}, `<input class="cbf-input" id="f-name" maxlength="30" value="${escapeAttr(d.profile.name)}">` + counter(d.profile.name.length, 15));
    html += field("年齡", {req:true, optional:false}, `<input class="cbf-input" id="f-age" maxlength="30" value="${escapeAttr(d.profile.age)}">` + counter(d.profile.age.length, 15));
    html += field("職業", {req:true, optional:false}, `<input class="cbf-input" id="f-job" maxlength="30" value="${escapeAttr(d.profile.job)}">` + counter(d.profile.job.length, 15));
    html += field("來自角色的一句話", {req:true, optional:false}, `<input class="cbf-input" id="f-quote" maxlength="120" value="${escapeAttr(d.profile.quote)}">` + counter(d.profile.quote.length, 80));
    html += field("敘述", {optional:true, hint:"角色詳情頁的前導文字，玩家開聊前可讀取。"}, `<textarea class="cbf-textarea tall" id="f-narration" maxlength="900">${escapeHtml(d.profile.narration)}</textarea>` + counter(d.profile.narration.length, 700));
    html += field("標籤", {optional:true}, renderTags());
    html += field("創作者筆記", {optional:true}, `<textarea class="cbf-textarea" id="f-creatorNote" maxlength="250">${escapeHtml(d.profile.creatorNote)}</textarea>` + counter(d.profile.creatorNote.length, 200));
  }

  if (activeTab === "basic") {
    html += `<div class="cbf-section-note">三大格——讀取率最高的核心欄位。</div>`;
    html += `<div class="cbf-field"><div class="cbf-field-label">性別</div>
      <div class="cbf-radio-row">
        <label><input type="radio" name="gender" value="男" ${d.basic.gender==="男"?"checked":""}> 男</label>
        <label><input type="radio" name="gender" value="女" ${d.basic.gender==="女"?"checked":""}> 女</label>
        <label><input type="radio" name="gender" value="未設置" ${d.basic.gender==="未設置"?"checked":""}> 未設置</label>
      </div></div>`;
    html += field("基本資訊", {req:true, optional:false, hint:"請輸入背景、家庭、MBTI、身高等"}, `<textarea class="cbf-textarea tall" id="f-info" maxlength="900">${escapeHtml(d.basic.info)}</textarea>` + counter(d.basic.info.length, 700));
    html += field("性格", {req:true, optional:false}, `<textarea class="cbf-textarea tall" id="f-personality" maxlength="900">${escapeHtml(d.basic.personality)}</textarea>` + counter(d.basic.personality.length, 700));
    html += field("說話風格與習慣", {req:true, optional:false}, `<textarea class="cbf-textarea tall" id="f-speech" maxlength="900">${escapeHtml(d.basic.speech)}</textarea>` + counter(d.basic.speech.length, 700));
  }

  if (activeTab === "firstScene") {
    html += `<div class="cbf-section-note">設定第一個場景後，聊天開始時會套用該情境。公開角色並設定第一個場景後，將顯示在推薦畫面上。</div>`;
    html += field("情境腳本", {optional:true, hint:"例）睡前，角色因無聊而主動發訊息的情況"}, `<textarea class="cbf-textarea tall" id="f-scenario" maxlength="900">${escapeHtml(d.firstScene.scenario)}</textarea>` + counter(d.firstScene.scenario.length, 800));
    html += field("角色對話", {optional:true, hint:"例）以後收到我的訊息後，請在3秒內回覆"}, `<textarea class="cbf-textarea tall" id="f-dialogue" maxlength="900">${escapeHtml(d.firstScene.dialogue)}</textarea>` + counter(d.firstScene.dialogue.length, 800));
    html += field("背景圖片", {optional:true, hint:"建議使用 9:16 比例的圖片。若未上傳，角色個人資料圖片將作為背景。此工具不處理圖片上傳。"}, `<div class="cbf-field-hint">請直接在卿卿我我後台上傳。</div>`);
  }

  if (activeTab === "details") {
    html += `<div class="cbf-section-note">若您希望在基本設定外填寫詳細內容，請在此編寫。</div>`;
    html += field("喜歡", {optional:true}, `<input class="cbf-input" id="f-likes" maxlength="80" value="${escapeAttr(d.details.likes)}">` + counter(d.details.likes.length, 50));
    html += field("不喜歡", {optional:true}, `<input class="cbf-input" id="f-dislikes" maxlength="80" value="${escapeAttr(d.details.dislikes)}">` + counter(d.details.dislikes.length, 50));
    html += field("生日", {optional:true}, `<input class="cbf-input" id="f-birthday" placeholder="YYYY-MM-DD" value="${escapeAttr(d.details.birthday)}">`);
    html += `<div class="cbf-field"><div class="cbf-field-label">附加資訊 <span class="optional">(${d.details.extras.length}/10)</span></div>`;
    d.details.extras.forEach((ex, i) => {
      html += `<div class="cbf-card" data-extra="${i}">
        <div class="cbf-card-head"><span class="cbf-card-title">附加資訊 #${i+1}</span><button class="cbf-remove-btn" data-remove-extra="${i}">移除</button></div>
        <input class="cbf-input" style="margin-bottom:10px" placeholder="名稱" data-extra-name="${i}" value="${escapeAttr(ex.name)}">
        <textarea class="cbf-textarea" placeholder="內容" data-extra-content="${i}">${escapeHtml(ex.content)}</textarea>
      </div>`;
    });
    if (d.details.extras.length < 10) {
      html += `<button class="cbf-add-btn" id="add-extra">＋ 添加附加資訊</button>`;
    }
    html += `</div>`;
  }

  if (activeTab === "events") {
    html += `<div class="cbf-section-note">對話中出現相關關鍵字時，AI 會自然參考的特殊情境設定。</div>`;
    if (d.events.length === 0) html += `<div class="cbf-empty">尚未新增任何創作者事件。</div>`;
    d.events.forEach((ev, i) => {
      html += `<div class="cbf-card" data-event="${i}">
        <div class="cbf-card-head"><span class="cbf-card-title">事件 #${i+1}</span><button class="cbf-remove-btn" data-remove-event="${i}">移除</button></div>
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">時間和地點</div>
        <input class="cbf-input" style="margin-bottom:10px" maxlength="40" placeholder="例，主角歸來之前，2017年夏天" data-event-time="${i}" value="${escapeAttr(ev.timeLocation)}">
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">標題</div>
        <input class="cbf-input" style="margin-bottom:10px" maxlength="40" data-event-title="${i}" value="${escapeAttr(ev.title)}">
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">內容</div>
        <textarea class="cbf-textarea tall" maxlength="2100" data-event-content="${i}">${escapeHtml(ev.content)}</textarea>
        ${counter(ev.content.length, 2000)}
      </div>`;
    });
    html += `<button class="cbf-add-btn" id="add-event">＋ 建立一個新事件</button>`;
  }

  if (activeTab === "stories") {
    html += `<div class="cbf-section-note">可管理序章故事與遊玩過程中解鎖的故事。</div>`;
    html += `<div class="cbf-tier-group"><div class="cbf-tier-heading" style="color:var(--text)"><span class="tdot" style="background:var(--dot-first)"></span>序章（玩家開聊前可直接閱讀）</div>`;
    html += field("序章標題", {optional:true}, `<input class="cbf-input" id="f-prologueTitle" maxlength="40" value="${escapeAttr(d.stories.prologueTitle)}">`);
    html += field("序章內容", {optional:true}, `<textarea class="cbf-textarea tall" id="f-prologueContent" maxlength="2100">${escapeHtml(d.stories.prologueContent)}</textarea>` + counter(d.stories.prologueContent.length, 2000));
    html += `</div>`;

    html += `<div class="cbf-tier-group"><div class="cbf-tier-heading"><span class="tdot"></span>好感度解鎖故事</div>`;
    if (d.stories.items.length === 0) html += `<div class="cbf-empty">尚未新增任何故事。</div>`;
    d.stories.items.forEach((st, i) => {
      html += `<div class="cbf-card" data-story="${i}">
        <div class="cbf-card-head"><span class="cbf-card-title">故事 #${i+1}</span><button class="cbf-remove-btn" data-remove-story="${i}">移除</button></div>
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">好感度分級</div>
        <input class="cbf-input" list="tier-presets" style="margin-bottom:10px" data-story-tier="${i}" value="${escapeAttr(st.tier)}">
        <datalist id="tier-presets">${TIER_PRESETS.map(t=>`<option value="${t}">`).join("")}</datalist>
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">解鎖故事時的提示語</div>
        <input class="cbf-input" style="margin-bottom:10px" maxlength="70" placeholder="想聽聽這個故事嗎？" data-story-prompt="${i}" value="${escapeAttr(st.unlockPrompt)}">
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">故事標題</div>
        <input class="cbf-input" style="margin-bottom:10px" maxlength="40" data-story-title="${i}" value="${escapeAttr(st.title)}">
        <div class="cbf-field-label" style="font-size:12px;margin-bottom:3px">內容（500-2000字）</div>
        <textarea class="cbf-textarea tall" maxlength="2100" data-story-content="${i}">${escapeHtml(st.content)}</textarea>
        ${counter(st.content.length, 2000)}
        <div class="cbf-toggle-row">
          <div class="cbf-field-hint">啟用多重結局（根據玩家選擇設置故事結局和好感度獎勵）</div>
          <div class="cbf-toggle ${st.multiEnding?'on':''}" data-story-multiending="${i}"><div class="knob"></div></div>
        </div>
      </div>`;
    });
    html += `<button class="cbf-add-btn" id="add-story">＋ 創作故事</button></div>`;
  }

  if (activeTab === "settingBook") {
    html += `<div class="cbf-section-note">儲存角色後即可連結設定集（世界觀資料庫，可跨角色共用）。此工具先提供筆記欄位，供你草擬內容，正式連結請在卿卿我我後台操作。</div>`;
    html += field("設定集草稿", {optional:true}, `<textarea class="cbf-textarea tall" id="f-settingBookNote">${escapeHtml(d.settingBook.note)}</textarea>`);
  }

  if (activeTab === "other") {
    html += `<div class="cbf-section-note">「其他」分頁的欄位是發布時的一次性設定（角色類型、內容政策聲明、年齡限制、公開性），不是需要反覆構思的創作內容，建議直接在卿卿我我後台正式設定，這裡只提供發布前檢查清單提醒。</div>`;
    html += `<div class="cbf-card">
      <div class="cbf-card-head"><span class="cbf-card-title">發布前檢查清單</span></div>
      <div style="font-size:13px;line-height:2.1">
        ☐ 角色類型設定（原創角色／二次創作／其他）<br>
        ☐ 內容政策設定：此角色是否基於真人物或未成年人（如實回答）<br>
        ☐ 年齡限制設定<br>
        ☐ 可見性（公開／私人）<br>
        ☐ 聊天室代碼設定（如需要）
      </div>
    </div>`;
    html += field("其他（暫存筆記）", {optional:true, hint:"例如想放進角色類型設定的分類理由、可見性決策的考量等，供自己備忘用。"}, `<textarea class="cbf-textarea tall" id="f-otherNote">${escapeHtml(d.other.note)}</textarea>`);
  }

  body.innerHTML = html;
  bindEvents();
}

function renderTags() {
  const d = currentData;
  return `<div id="f-tags-wrap">
    ${d.profile.tags.map((t,i) => `<span class="cbf-tag" data-tag-idx="${i}">${escapeHtml(t)}<span data-remove-tag="${i}">×</span></span>`).join("")}
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input class="cbf-input" id="f-tag-input" placeholder="輸入標籤後按新增" style="flex:1">
      <button class="cbf-btn" id="f-tag-add" style="flex:0 0 auto;padding:9px 16px">新增</button>
    </div>`;
}

function bindEvents() {
  const d = currentData;

  bindText("f-name", null, v => d.profile.name = v, 15);
  bindText("f-age", null, v => d.profile.age = v, 15);
  bindText("f-job", null, v => d.profile.job = v, 15);
  bindText("f-quote", null, v => d.profile.quote = v, 80);
  bindText("f-narration", null, v => d.profile.narration = v, 700);
  bindText("f-creatorNote", null, v => d.profile.creatorNote = v, 200);
  const nativeLangEl = document.getElementById("f-nativeLang");
  if (nativeLangEl) nativeLangEl.onchange = () => { d.profile.nativeLang = nativeLangEl.value; markSaving(); };

  document.getElementById("f-tag-add")?.addEventListener("click", () => {
    const input = document.getElementById("f-tag-input");
    if (input.value.trim()) { d.profile.tags.push(input.value.trim()); markSaving(); renderBody(); }
  });
  document.querySelectorAll("[data-remove-tag]").forEach(el => {
    el.onclick = () => { d.profile.tags.splice(parseInt(el.dataset.removeTag), 1); markSaving(); renderBody(); };
  });

  document.querySelectorAll('input[name="gender"]').forEach(r => {
    r.onchange = () => { d.basic.gender = r.value; markSaving(); };
  });
  bindText("f-info", null, v => d.basic.info = v, 700);
  bindText("f-personality", null, v => d.basic.personality = v, 700);
  bindText("f-speech", null, v => d.basic.speech = v, 700);

  bindText("f-scenario", null, v => d.firstScene.scenario = v, 800);
  bindText("f-dialogue", null, v => d.firstScene.dialogue = v, 800);

  bindText("f-likes", null, v => d.details.likes = v, 50);
  bindText("f-dislikes", null, v => d.details.dislikes = v, 50);
  const bday = document.getElementById("f-birthday");
  if (bday) bday.oninput = () => { d.details.birthday = bday.value; markSaving(); };

  document.querySelectorAll("[data-extra-name]").forEach(el => {
    el.oninput = () => { d.details.extras[parseInt(el.dataset.extraName)].name = el.value; markSaving(); };
  });
  document.querySelectorAll("[data-extra-content]").forEach(el => {
    el.oninput = () => { d.details.extras[parseInt(el.dataset.extraContent)].content = el.value; markSaving(); };
  });
  document.querySelectorAll("[data-remove-extra]").forEach(el => {
    el.onclick = () => { d.details.extras.splice(parseInt(el.dataset.removeExtra),1); markSaving(); renderBody(); };
  });
  document.getElementById("add-extra")?.addEventListener("click", () => {
    if (d.details.extras.length < 10) { d.details.extras.push({name:"",content:""}); markSaving(); renderBody(); }
  });

  document.querySelectorAll("[data-event-time]").forEach(el => { el.oninput = () => { d.events[parseInt(el.dataset.eventTime)].timeLocation = el.value; markSaving(); }; });
  document.querySelectorAll("[data-event-title]").forEach(el => { el.oninput = () => { d.events[parseInt(el.dataset.eventTitle)].title = el.value; markSaving(); }; });
  document.querySelectorAll("[data-event-content]").forEach(el => { el.oninput = () => { d.events[parseInt(el.dataset.eventContent)].content = el.value; markSaving(); const c=el.parentElement.querySelector('.cbf-counter'); if(c) c.outerHTML=counter(el.value.length,2000); }; });
  document.querySelectorAll("[data-remove-event]").forEach(el => { el.onclick = () => { d.events.splice(parseInt(el.dataset.removeEvent),1); markSaving(); renderBody(); }; });
  document.getElementById("add-event")?.addEventListener("click", () => { d.events.push({timeLocation:"",title:"",content:""}); markSaving(); renderBody(); });

  bindText("f-prologueTitle", null, v => d.stories.prologueTitle = v);
  bindText("f-prologueContent", null, v => d.stories.prologueContent = v, 2000);

  document.querySelectorAll("[data-story-tier]").forEach(el => { el.oninput = () => { d.stories.items[parseInt(el.dataset.storyTier)].tier = el.value; markSaving(); }; });
  document.querySelectorAll("[data-story-prompt]").forEach(el => { el.oninput = () => { d.stories.items[parseInt(el.dataset.storyPrompt)].unlockPrompt = el.value; markSaving(); }; });
  document.querySelectorAll("[data-story-title]").forEach(el => { el.oninput = () => { d.stories.items[parseInt(el.dataset.storyTitle)].title = el.value; markSaving(); }; });
  document.querySelectorAll("[data-story-content]").forEach(el => { el.oninput = () => { d.stories.items[parseInt(el.dataset.storyContent)].content = el.value; markSaving(); const c=el.parentElement.querySelector('.cbf-counter'); if(c) c.outerHTML=counter(el.value.length,2000); }; });
  document.querySelectorAll("[data-story-multiending]").forEach(el => {
    el.onclick = () => { const i = parseInt(el.dataset.storyMultiending); d.stories.items[i].multiEnding = !d.stories.items[i].multiEnding; markSaving(); renderBody(); };
  });
  document.querySelectorAll("[data-remove-story]").forEach(el => { el.onclick = () => { d.stories.items.splice(parseInt(el.dataset.removeStory),1); markSaving(); renderBody(); }; });
  document.getElementById("add-story")?.addEventListener("click", () => { d.stories.items.push({tier:"熟人",unlockPrompt:"",title:"",content:"",multiEnding:false}); markSaving(); renderBody(); });

  bindText("f-settingBookNote", null, v => d.settingBook.note = v);
  bindText("f-otherNote", null, v => d.other.note = v);
}

async function initApp() {
  document.getElementById("cbf-loading-screen").style.display = "block";
  await loadAll();
  currentData = await getCurrentChar();
  activeTab = "profile"; showExport = false;
  document.getElementById("cbf-loading-screen").style.display = "none";
  document.getElementById("cbf-app-sidebar").style.display = "flex";
  document.getElementById("cbf-app-main").style.display = "flex";
  renderCharSelect();
  renderNav();
  renderBody();
}

document.getElementById("cbf-login-submit").addEventListener("click", async () => {
  const email = document.getElementById("cbf-login-email").value.trim();
  const password = document.getElementById("cbf-login-password").value;
  const errEl = document.getElementById("cbf-login-error");
  errEl.classList.remove("show");
  const btn = document.getElementById("cbf-login-submit");
  btn.disabled = true; btn.textContent = "登入中…";
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    errEl.textContent = "登入失敗：" + (e.code === "auth/invalid-credential" ? "帳號或密碼錯誤" : e.message);
    errEl.classList.add("show");
  }
  btn.disabled = false; btn.textContent = "登入";
});

document.getElementById("cbf-logout-btn").addEventListener("click", async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById("cbf-login-screen").style.display = "none";
    document.getElementById("cbf-account-email").textContent = user.email;
    await initApp();

    document.getElementById("cbf-export-char").onclick = () => { showExport = true; renderBody(); };
    document.getElementById("cbf-reseed-char").onclick = async () => {
      if (!confirm(`確定要把「${db.activeCharacter}」目前所有欄位，覆蓋成最新的預設內容嗎？此動作無法復原。`)) return;
      const seed = db.activeCharacter === "逢白淥" ? fengBaiLu() : blankCharacter(db.activeCharacter);
      await saveCharacterDoc(db.activeCharacter, seed);
      currentData = seed;
      showExport = false; activeTab = "profile";
      renderNav(); renderBody();
    };
    document.getElementById("cbf-new-char").onclick = async () => {
      const name = prompt("新角色名稱：");
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (db.names.includes(trimmed)) { alert("這個名字已經存在了"); return; }
      db.names.push(trimmed);
      db.activeCharacter = trimmed;
      await saveCharacterDoc(trimmed, blankCharacter(trimmed));
      await saveIndex();
      currentData = await getCurrentChar();
      activeTab = "profile"; showExport = false;
      renderCharSelect(); renderNav(); renderBody();
    };
    document.getElementById("cbf-delete-char").onclick = async () => {
      if (db.names.length <= 1) { alert("至少要保留一個角色"); return; }
      if (!confirm(`確定要刪除「${db.activeCharacter}」的所有資料嗎？此動作無法復原。`)) return;
      const removed = db.activeCharacter;
      db.names = db.names.filter(n => n !== removed);
      db.activeCharacter = db.names[0];
      await deleteCharacterDoc(removed);
      await saveIndex();
      currentData = await getCurrentChar();
      activeTab = "profile"; showExport = false;
      renderCharSelect(); renderNav(); renderBody();
    };
  } else {
    currentUser = null;
    document.getElementById("cbf-loading-screen").style.display = "none";
    document.getElementById("cbf-app-sidebar").style.display = "none";
    document.getElementById("cbf-app-main").style.display = "none";
    document.getElementById("cbf-login-screen").style.display = "flex";
  }
});
</script>
